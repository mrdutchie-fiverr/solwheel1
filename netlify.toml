# Everything lives in this one folder: the website (index.html) and the 4 functions (*.mjs).
# The .mjs files are pre-built: all code and libraries are inside them, nothing to install.
[build]
  publish = "."
  functions = "."

# runs every 5 minutes, on the spin mark (holder snapshot, spin, payout, fee claim). Once per round keeps it inside the free plan.
[functions."tick"]
  schedule = "*/5 * * * *"

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200

[[redirects]]
  from = "/api/live"
  to = "/.netlify/functions/live"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/debug"
  to = "/.netlify/functions/debug"
  status = 200

[[redirects]]
  from = "/api/round/*"
  to = "/.netlify/functions/round?id=:splat"
  status = 200
